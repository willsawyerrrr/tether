name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    uses: willsawyerrrr/platform/.github/workflows/release.yml@main
    with:
      cask: tether
      asset: Tether.zip
      build-command: |
        macos/scripts/build-app.sh .build/app "$VERSION"
        ditto -c -k --keepParent macos/.build/app/Tether.app Tether.zip
    secrets: inherit
