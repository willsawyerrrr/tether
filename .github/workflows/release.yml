name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    uses: willsawyerrrr/platform/.github/workflows/release.yml@main
    with:
      cask: tether
      asset: Tether.zip
      build-command: |
        macos/scripts/package-app.sh "$VERSION"
    secrets: inherit
